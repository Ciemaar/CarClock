name: Android CI PR Check

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

permissions: read-all

jobs:
  build_and_test:
    name: Build, Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Spotless Check (Kotlin & Markdown formatting)
        run: ./gradlew spotlessCheck

      - name: Run Detekt (Kotlin Static Analysis)
        run: ./gradlew detekt

      - name: Verify Kotlin Documentation (Dokka)
        run: ./gradlew dokkaHtml

      - name: Run Android Lint (Code Quality)
        run: ./gradlew lintDebug

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Verify Minimum Test Coverage (Kover)
        run: ./gradlew koverVerifyDebug

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
